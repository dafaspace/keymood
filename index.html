function setRel(r) {
  // Guard the same way the palette and lens loaders are guarded: an unknown name left
  // activeRel pointing at nothing and the next render() threw on rel.getTarget, taking
  // the wheel down. Only reachable from a share link or a stale build, but the whole
  // point of the other clamps was that a bad value must never reach the draw loop.
  if (!Object.prototype.hasOwnProperty.call(RELS, r)) return;
  activeRel = r;          // active button state is re-rendered by the Theory lens
  render();
  renderAssistPanel();
}
window.setRel = setRel;

// ── Panel ─────────────────────────────────────────────────────────────────────
function getModeChords(slice, modeIdx, tonicSlice) {
  var m    = MODES[modeIdx];
  var root = MROOT[slice];
  var useSol = isSol();
  var nn   = notesForSlice(tonicSlice !== undefined ? tonicSlice : slice);
  var notes  = [];
  var chords = [];
  for (var i=0; i<7; i++) {
    var nr = (root + m.iv[i]) % 12;
    // The SCALE row carries the solfège (that's where degrees teach something);
    // CHORDS keep note names either way, since "Dom / Rem / Me" names no chord
    // anyone would write.
    notes.push(useSol ? solDeg(i, m.iv[i]) : nn[nr]);
    var t   = m.ct[i];
    var num = (t==='min'||t==='dim') ? ROM_MIN[i] : ROM_MAJ[i];
    chords.push({ name: nn[nr]+(t==='min'?'m':t==='dim'?'°':''), num:num, type:t });
  }
  return { notes:notes, chords:chords };
}

// Secondary dominants of the CURRENTLY SELECTED mode. This used to hardcode
// MODES[0] (Ionian) while being called with a modal tonic, so A Dorian was given
// A major's set - chords like G♯7 "resolving to C♯m", a chord that doesn't exist in
// A Dorian. Degree 0 is skipped too: V/I is just the dominant, not a SECONDARY one.
function getSecondaryDominants(slice, tSlice, modeIdx) {
  var m    = MODES[modeIdx || 0];
  var root = MROOT[slice];
  var nn = notesForSlice(tSlice !== undefined ? tSlice : slice);
  var result = [];
  for (var i=1; i<7; i++) {
    var target = m.ct[i];
    if (target === 'dim') continue;   // a diminished degree has no functional dominant
    var targetRoot = (root + m.iv[i]) % 12;
    var secDomRoot = (targetRoot + 7) % 12;
    // Spell the secondary dominant with the KEY's own accidental convention, not
    // always sharps: in D♭ major the V/ii is B♭7, never "A♯7". (nn is the flat or
    // sharp table chosen for this key signature.)
    var secDomName = nn[secDomRoot];
    var targetName = nn[targetRoot] + (target==='min'?'m':'');
    result.push({ chord: secDomName+'7', resolves: targetName, rootSemi: secDomRoot,
                  num: 'V/' + (target==='min'?ROM_MIN:ROM_MAJ)[i] });
  }
  return result;
}

function updatePanel() {
  var panel = document.getElementById('panel');
  // Quiz owns the panel while active - anything that repaints the panel mid-question
  // (tab/notation/palette changes) used to destroy it while quizMode stayed true,
  // leaving wheel clicks routed to a dead quiz (TypeError on #qnext).
  if (quizMode) { renderQuizPanel(); return; }
  if (appMode === 'assist') { renderAssistPanel(); return; }
  if (!selected) {
    panel.innerHTML = '<div class="phead">Info</div><div class="pbody"><div class="empty">Tap a key on the circle</div></div>';
    return;
  }

  var slice    = selected.slice;
  var modeIdx  = selected.modeIdx;
  var mode     = MODES[modeIdx];
  var fromInner = !!selected.fromInner;

  // actualSlice = note to display
  // fromInner=true:  slice=parent sector → compute note via mode.off (E.g. G+Aeolian=E Aeolian)
  // fromInner=false: slice=actual note   → C+Aeolian=C Aeolian (parallel minor)
  var actualSlice, accSlice, parentSlice;
  if (fromInner) {
    actualSlice = MROOT.indexOf((MROOT[slice] + mode.off) % 12);
    accSlice    = slice;
    parentSlice = slice;
  } else {
    actualSlice = slice;
    if (modeIdx === 0) {
      accSlice    = slice;
      parentSlice = null;
    } else {
      var pRoot   = (MROOT[actualSlice] - mode.off + 120) % 12;
      parentSlice = MROOT.indexOf(pRoot);
      accSlice    = parentSlice;
    }
  }

  var col     = SYNTH[actualSlice];
  // Spelling comes from the line of fifths, not from a per-sector table. accSlice is
  // the sector whose MAJOR signature happens to sit nearest on the wheel; for 16 of the
  // 84 sector x mode pairs that is the enharmonic twin of the real parent, so reading
  // the signature off it printed "Db Dorian, II mode of B major" - five sharps, no
  // flats, for a key spelt with flats.
  var _ks     = keySpelling(actualSlice, modeIdx);
  var acc     = accStrF(_ks.sig);
  var accNotes = accNotesStrF(_ks.sig);
  // The key's NAME stays a note name in movable-do - the tonic is Do by definition,
  // so "Do Dorian" would name every key identically.
  // Ionian and Aeolian are named the way people ask for them - "C major", "A minor"
  // - with the modal name kept as a parenthetical. Leading with the Greek term meant
  // a student who tapped the sector labelled "Am" got a panel headed "A Aeolian",
  // i.e. the app renamed the thing they had just pointed at. The other five modes
  // have no common-language name, so they stand alone.
  var _modeLabel = modeIdx === 0 ? 'major (Ionian)'
                 : modeIdx === 4 ? 'minor (Aeolian)'
                 : mode.name;
  // _ks.tonic, not MAJSHORT[actualSlice]: on six of the 84 pairs the sector's own label
  // is unusable as a tonic name (Db Aeolian's parent would be Fb major, eight flats),
  // and the line respells it to the reachable one - C# Aeolian, parent E major.
  var keyName = _ks.tonic + ' ' + _modeLabel;
  var camLabel = isCamelot() ? ' <span style="font-size:11px;opacity:.55;font-weight:400;margin-left:4px">' + CAM_MAJ[accSlice] + (mode.type==='maj'?'B':'A') + '</span>' : '';
  var data    = getModeChords(actualSlice, modeIdx, accSlice);
  var notes   = data.notes;
  var chords  = data.chords;
  var ctxHTML = '';
  // Modal needs this line MOST (a guitarist checking "A Dorian" wants to know it's
  // the II mode of G major) - it used to be suppressed there by a tonal-only guard.
  if (parentSlice !== null && parentSlice !== undefined && modeIdx !== 0) {
    ctxHTML = MODE_NUMS[modeIdx] + ' mode of <strong>' + _ks.parent + ' major</strong>';
  }

  // The relation block that used to be built here is gone. It printed whatever
  // `activeRel` held - but activeRel is set ONLY from the Assist tab's Relations lens,
  // so choosing Tritone over there silently re-headed this section in Tonal and Modal,
  // where there is no control to change it back and the wheel doesn't even draw the
  // highlight (showRel is gated on appMode === 'assist'). A control in one tab quietly
  // rewriting content in another, with no way home. Its default was Neighbours, which
  // duplicated the Dominant and Subdominant tiles in Quick nav immediately below it, so
  // nothing is lost by dropping it here; the full relation lens still lives in Assist,
  // where it has its picker and its wheel highlights.

  // Scale HTML
  var scaleHTML = '';
  for (var i=0; i<notes.length; i++) {
    var _nSemi = MROOT[actualSlice] + MODES[modeIdx].iv[i]; // no %12 - _playNote handles octave
    // <button>, not <div>: these are controls that make a sound, and as divs they had
    // no tab stop, no role, no Enter/Space and no focus ring - the app's second core
    // interaction was pointer-only. A button gets all four for free.
    scaleHTML += '<button type="button" class="sn'+(i===0?' root':'')
      +'" onclick="playNotePill('+_nSemi+')" aria-label="Play '+notes[i]
      +(i===0?', the tonic':'')+'" style="cursor:pointer'
      +(i===0?';background:'+col+';color:'+(sectorLum(col,1)>LUM_FLIP?'#000':'#fff'):'')+'">'+notes[i]+'</button>';
  }

    // Chords HTML
  var chordsHTML = '';
  for (var i=0; i<chords.length; i++) {
    var cc = chordCol(chords[i].type);
    var _cS = (MROOT[actualSlice] + MODES[modeIdx].iv[i]) % 12;
    var _cT = chords[i].type;
    chordsHTML += '<button type="button" class="cp" style="background:'+cc.bg+';color:'+cc.tx
      +';cursor:pointer" onclick="playChordPill('+_cS+',\'' + _cT + '\')"'
      +' aria-label="Play '+chords[i].name+', the '+chords[i].num+' chord"><span>'
      +chords[i].num+'</span>'+chords[i].name+'</button>';
  }

  // (The relation pills that were built here went with the block above - they were its
  // only consumer. The Assist lens builds its own.)

  // Quick nav. Step a fifth from the ACTUAL TONIC, not from the parent's sector -
  // reading accSlice meant A Dorian was offered "D Dorian" as its dominant (that's
  // the subdominant; the dominant is E Dorian), and Am got G/F instead of Em/Dm.
  var domSlice   = (actualSlice+1)%12;
  var subSlice   = (actualSlice+11)%12;
  var domName    = MAJSHORT[domSlice] + ' ' + mode.name;
  var subName    = MAJSHORT[subSlice] + ' ' + mode.name;
  // Exactly one of "parallel major" and "parallel minor" is always a no-op: in C major
  // the app offered "Parallel major -> C major", a tile that takes you where you already
  // are, and in A minor the minor one does the same. Offer only the one that changes
  // something. (Locrian is dim; treat it with the minors and offer the major.)
  var parIsMinor = mode.type === 'maj';
  var parLabel   = parIsMinor ? 'Parallel minor' : 'Parallel major';
  var parKeyName = MAJSHORT[actualSlice] + (parIsMinor ? ' minor' : ' major');
  var parMode    = parIsMinor ? 4 : 0;

  // Secondary dominants
  var sdList = getSecondaryDominants(actualSlice, accSlice, modeIdx);
  var sdHTML = '';
  for (var i=0; i<sdList.length; i++) {
    // Was a <span> whose only content was "A7", with the entire point of the thing -
    // WHAT it resolves to - hidden in a title attribute, which does not exist on touch.
    // So a phone showed five decorative chips reading "A7 B7 C7 D7 E7" with no stated
    // relationship to anything, styled exactly like the pills next to them that DO
    // respond. Now the relationship is on screen, and the chord plays: a secondary
    // dominant is a sound you want to hear resolve, not a label.
    sdHTML += '<button type="button" class="sd-item" onclick="playChordPill('+sdList[i].rootSemi+',\'dom7\')"'
      + ' aria-label="Play '+sdList[i].chord+', '+sdList[i].num+', resolves to '+sdList[i].resolves+'">'
      + sdList[i].chord + '<span class="sd-to">→ '+sdList[i].resolves+'</span></button>';
  }

    // Minor-ring toggle lives in the Tonal panel header (TA-toggle style), since the
    // inner ring is optional only here. Modal hides minor; Assist always shows it.
    var minorTog = appMode==='tonal'
      ? '<div class="ta-toggle" style="margin-left:auto"><button class="ta-seg'
        +(document.getElementById('cb-minor').checked?' active':'')
        +'" onclick="toggleMinorRing()" title="Show the minor (inner) ring">Minor ring</button></div>'
      : '';
    // phead is FUNCTIONAL (swatch + the minor-ring control) - key-big right below is
    // the single place the key's IDENTITY (name/Camelot) is printed, so it isn't said
    // twice in a ~13px-tall strip.
    panel.innerHTML =
    '<div class="phead"><span class="sw" style="background:'+col+'"></span>'+minorTog+'</div>' +
    '<div class="pbody">' +
      '<div class="key-big">'+keyName+camLabel+tStepHTML()+'</div>' +
      // Naming which notes the accidentals ARE (the ring only shows the count) -
      // C major shows nothing here, which itself teaches ("no accidentals").
      (!isCamelot() ? '<div class="key-sub">'+(acc?acc+' ('+accNotes+') \u00b7 ':'')+mode.mood+'</div>' : '<div class="key-sub">'+mode.mood+'</div>') +
      // Ionian has no parent-mode context (ctxHTML is empty) - don't reserve the
      // 31px ctx-line box for nothing.
      (ctxHTML ? '<div class="ctx-line">'+ctxHTML+'</div>' : '') +

      '<div class="slabel">Scale</div>' +
      '<div class="scale-row">'+scaleHTML+'</div>' +

      '<div class="slabel">Diatonic chords</div>' +
      '<div class="chord-grid">'+chordsHTML+'</div>' +

      // Secondary info (relations, quick nav, secondary dominants) is opt-in so the
      // default panel stays short enough to fit a phone with NO scroll.
      '<button class="more-btn" onclick="togglePanelMore()">'+(panelMore?'Less':'More')+'</button>' +
      '<div class="panel-more"'+(panelMore?'':' style="display:none"')+'>' +
        '<div class="slabel">Quick nav</div>' +
        '<div class="nav-grid">' +
          '<button type="button" class="ni" onclick="goKey('+actualSlice+','+parMode+')"><div class="nl">'+parLabel+'</div><div class="nk">'+parKeyName+'</div></button>' +
          '<button type="button" class="ni" onclick="goKey('+domSlice+','+modeIdx+')"><div class="nl">Dominant</div><div class="nk">'+domName+'</div></button>' +
          '<button type="button" class="ni" onclick="goKey('+subSlice+','+modeIdx+')"><div class="nl">Subdominant</div><div class="nk">'+subName+'</div></button>' +
        '</div>' +

        '<div class="slabel">Secondary dominants</div>' +
        '<div class="sec-dom"><div class="sd-list">'+sdHTML+'</div></div>' +
      '</div>' +
    '</div>';
}

var MODE_NUMS = ['I','IV','V','II','VI','III','VII']; // indexed by modeIdx

function goKey(slice, modeIdx) {
  selected = { slice:slice, tonicSlice:slice, modeIdx:modeIdx, fromInner: false };
  lastModeIdx = modeIdx;
  buildModeStrip();
  render();
  updatePanel();
  playTonic(slice, modeIdx, false);
}
window.goKey = goKey;

// ── Quiz ──────────────────────────────────────────────────────────────────────
function qName(s){return s.replace(/♯/g,'#').replace(/♭/g,'b');}
var QUIZ = [
  function(i) {
    return { q:'How many accidentals does '+qName(MAJSHORT[i])+' major have?', correct:i,
      opts:shuffled4(i, function(j){ var a=accStr(j); return a||'none'; }) };
  },
  function(i) {
    return { q:'What is the dominant key of '+qName(MAJSHORT[i])+' major?', correct:(i+1)%12,
      opts:shuffled4((i+1)%12, function(j){ return qName(MAJSHORT[j])+' major'; }) };
  },
  function(i) {
    return { q:'What is the subdominant key of '+qName(MAJSHORT[i])+' major?', correct:(i+11)%12,
      opts:shuffled4((i+11)%12, function(j){ return qName(MAJSHORT[j])+' major'; }) };
  },
  function(i) {
    return { q:'What is the relative minor of '+qName(MAJSHORT[i])+' major?', correct:i,
      opts:shuffled4(i, function(j){ return qName(MINNAMES[j]); }) };
  },
  function(i) {
    var ps = MROOT.indexOf((MROOT[i]-2+12)%12);
    // Only ask where the wheel's name for the tonic is the one the PARENT key
    // actually spells. Otherwise the "correct" answer is only an enharmonic stand-in
    // (D♭ Dorian really belongs to C♭ major, which the wheel can't name, so the app
    // would answer "B major" - right pitch, contradictory spelling). startQuiz()
    // re-rolls when a generator throws.
    if (notesForSlice(ps)[MROOT[i]] !== MAJSHORT[i]) throw 0;
    return { q:qName(MAJSHORT[i])+' Dorian is the II mode of which major key?', correct:ps,
      opts:shuffled4(ps, function(j){ return qName(MAJSHORT[j])+' major'; }) };
  },
  function(i) {
    var ps = MROOT.indexOf((MROOT[i]-7+12)%12);
    if (notesForSlice(ps)[MROOT[i]] !== MAJSHORT[i]) throw 0;   // see the Dorian note above
    return { q:qName(MAJSHORT[i])+' Mixolydian is the V mode of which major key?', correct:ps,
      opts:shuffled4(ps, function(j){ return qName(MAJSHORT[j])+' major'; }) };
  },
  function(i) {
    var ps = MROOT.indexOf((MROOT[i]-9+12)%12);
    return { q:qName(MAJSHORT[i])+' Aeolian is the VI mode of which major key?', correct:ps,
      opts:shuffled4(ps, function(j){ return qName(MAJSHORT[j])+' major'; }) };
  },
  function(i) {
    return { q:'Which key is a tritone away from '+qName(MAJSHORT[i])+'?', correct:(i+6)%12,
      opts:shuffled4((i+6)%12, function(j){ return qName(MAJSHORT[j]); }) };
  },
  function(i) {
    return { q:'Name the diatonic V chord in '+qName(MAJSHORT[i])+' major.', correct:(i+1)%12,
      opts:shuffled4((i+1)%12, function(j){ return qName(MAJSHORT[j]); }) };
  },
  // Parallel minor: SAME ROOT NOTE, different key signature (C major -> Cm). These two
  // said correct:i, which points at MINNAMES[i] - the RELATIVE minor. That made both
  // questions byte-identical to the relative-major/minor pair below AND marked the right
  // answer wrong: "parallel minor of C major" accepted Am and rejected Cm. Two of
  // seventeen generators, so roughly one question in eight was teaching the wrong
  // definition and failing students who knew it.
  function(i) {
    var pm = MROOT.indexOf((MROOT[i]+3)%12);          // the minor whose ROOT is MROOT[i]
    // Same enharmonic discipline as the mode questions above: if the wheel spells that
    // minor's root differently from this major's (Db major vs C#m), don't ask.
    if (MINNAMES[pm].slice(0,-1) !== MAJSHORT[i]) throw 0;
    return { q:'What is the parallel minor of '+qName(MAJSHORT[i])+' major?', correct:pm,
      opts:shuffled4(pm, function(j){ return qName(MINNAMES[j]); }) };
  },
  // Parallel major (Am -> A major)
  function(i) {
    var pM = MROOT.indexOf((MROOT[i]+9)%12);          // the major whose ROOT is MINNAMES[i]'s
    if (MAJSHORT[pM] !== MINNAMES[i].slice(0,-1)) throw 0;
    return { q:'What is the parallel major of '+qName(MINNAMES[i])+'?', correct:pM,
      opts:shuffled4(pM, function(j){ return qName(MAJSHORT[j])+' major'; }) };
  },
  // Relative major - same sector (same key signature)
  function(i) {
    return { q:'Relative major of '+qName(MINNAMES[i])+'?', correct:i,
      opts:shuffled4(i, function(j){ return qName(MAJSHORT[j])+' major'; }) };
  },
  // Conceptual (non-key) questions: text-only answers, shuffled, no wheel
  // interaction (noWheel) - random wheel taps used to answer them via meaningless
  // fake slices, and the "correct answer" highlight landed on a random key.
  function(i) {
    return { q:'Which degree is raised in Lydian compared to major?',
      noWheel:1, opts:shuffledText('4', ['2','6','7']) };
  },
  function(i) {
    return { q:'Which degree is lowered in Mixolydian compared to major?',
      noWheel:1, opts:shuffledText('7', ['3','6','2']) };
  },
  function(i) {
    return { q:'What makes Phrygian darker than Aeolian?',
      noWheel:1, opts:shuffledText('Lowered 2nd (b2)', ['Lowered 4th (b4)','Lowered 5th (b5)','Lowered 6th (b6)']) };
  },
  function(i) {
    var target = (i+7)%12; // neapolitan = -5 steps = +7 steps
    return { q:'What is the Neapolitan (bII) chord in '+qName(MAJSHORT[i])+' major?', correct:target,
      opts:shuffled4(target, function(j){ return qName(MAJSHORT[j])+' major'; }) };
  },
];

// Fisher-Yates. `sort(() => Math.random()-0.5)` is NOT a fair shuffle - measured over
// 200k rolls it placed the correct answer first 28.2% of the time and last only
// 18.7%, which a student can learn to exploit.
function _shuffle(a) {
  for (var i=a.length-1; i>0; i--) {
    var j = Math.floor(Math.random()*(i+1));
    var t = a[i]; a[i] = a[j]; a[j] = t;
  }
  return a;
}
function shuffled4(correct, label) {
  var pool = [correct];
  while (pool.length < 4) {
    var r = Math.floor(Math.random()*12);
    var found = false;
    for (var k=0;k<pool.length;k++) { if(pool[k]===r){found=true;break;} }
    if (!found) pool.push(r);
  }
  _shuffle(pool);
  var out = [];
  for (var i=0;i<pool.length;i++) out.push({ slice:pool[i], label:label(pool[i]), isCorrect:pool[i]===correct });
  return out;
}
// Text-only options for conceptual (non-key) questions - no slice/wheel mapping,
// shuffled so the correct answer isn't always first.
function shuffledText(correctLabel, wrongLabels) {
  var out = [{label:correctLabel, isCorrect:true}];
  for (var i=0;i<wrongLabels.length;i++) out.push({label:wrongLabels[i], isCorrect:false});
  return _shuffle(out);
}

function startQuiz() {
  // Some generators deliberately reject their key (an enharmonically ambiguous
  // tonic - see the Dorian/Mixolydian notes in QUIZ), so re-roll on failure. A
  // bounded loop rather than the old unbounded recursion: it can't blow the stack,
  // and the last attempt is forced onto a generator that never rejects.
  var q = null;
  for (var tries = 0; tries < 40 && !q; tries++) {
    var i    = Math.floor(Math.random()*12);
    var type = QUIZ[Math.floor(Math.random()*QUIZ.length)];
    try { q = type(i); } catch(e) { q = null; }
  }
  if (!q) q = { q:'What is the relative minor of '+qName(MAJSHORT[0])+' major?', correct:0,
                opts:shuffled4(0, function(j){ return qName(MINNAMES[j]); }) };
  quizState = { q:q.q, opts:q.opts, correct:q.correct, targetSlice:q.correct, noWheel:!!q.noWheel, answered:false };
  renderQuizPanel();
  selected = null; render();
}

function renderQuizPanel() {
  var scoreStr = quizTotal > 0 ? quizScore+' / '+quizTotal : '';
  var optsHTML = '';
  for (var i=0;i<quizState.opts.length;i++) {
    optsHTML += '<button class="qo" id="qo'+i+'" onclick="answerQuiz('+i+')">'+quizState.opts[i].label+'</button>';
  }
  // The quiz takes over the panel and the wheel, but used to leave no way out from
  // inside its own surface - the only exit was the unlabelled top-bar icon that
  // opened it. It now names itself and carries an explicit Exit, so it's an honest
  // takeover rather than a hidden mode.
  document.getElementById('panel').innerHTML =
    '<div class="phead" style="color:'+inkOn('#7B5EA7')+'">Quiz' +
      '<button class="quiz-exit" onclick="toggleQuiz()" aria-label="Exit quiz">Exit</button>' +
    '</div>' +
    '<div class="pbody">' +
      '<div style="font-size:11px;color:var(--text3);text-align:right;margin-bottom:8px">'+scoreStr+'</div>' +
      '<div style="font-size:13px;font-weight:500;color:var(--text);margin-bottom:11px;line-height:1.5">'+quizState.q+'</div>' +
      optsHTML +
      '<button class="quiz-next" id="qnext" onclick="startQuiz()">Next \u2192</button>' +
      '<div class="quiz-hint" id="qhint"></div>' +
    '</div>';
  // An ALREADY-ANSWERED question must come back answered. updatePanel() re-renders
  // this panel whenever the tab/notation/palette changes, so without this the
  // question would redraw as fresh: options live again but answerQuiz() refusing
  // to act (quizState.answered), and no Next button - a dead end.
  if (quizState.answered) _paintQuizAnswer();
}

// Paint the answered state onto the freshly-rendered options (used both when the
// user answers and when the panel is re-rendered after answering).
function _paintQuizAnswer() {
  var ok = quizState.pickedIdx !== undefined && quizState.opts[quizState.pickedIdx].isCorrect;
  for (var i=0;i<quizState.opts.length;i++) {
    var b=document.getElementById('qo'+i); if(!b) continue;
    b.disabled=true;
    if (quizState.opts[i].isCorrect) b.classList.add('correct');
    else if (i===quizState.pickedIdx) b.classList.add('wrong');
  }
  // Move focus BEFORE the disabling above can strand it: every option gets disabled,
  // including the one the keyboard user is standing on, and focus then falls to <body>
  // - so the next Tab restarts from the top of the page.
  var n=document.getElementById('qnext');
  if(n) { n.style.display='inline-block'; if (document.activeElement && document.activeElement.disabled) n.focus(); }
  var h=document.getElementById('qhint');
  if (h) {
    h.style.display='block';
    h.textContent = ok ? '\u2713 Correct!' : (quizState.noWheel ? '\u2717 Correct answer shown above' : '\u2717 Correct answer highlighted on the wheel');
  }
}

function answerQuiz(idx) {
  if (!quizState||quizState.answered) return;
  quizState.answered = true; quizState.pickedIdx = idx; quizTotal++;
  var _right = quizState.opts[idx].isCorrect;
  if (_right) quizScore++;
  _paintQuizAnswer();
  // The verdict was only ever painted. Say it, with the right answer when it's wrong -
  // otherwise a blind user learns nothing from getting it wrong, which is the whole
  // point of an ear-training quiz.
  var _corr = '';
  for (var _i=0; _i<quizState.opts.length; _i++)
    if (quizState.opts[_i].isCorrect) _corr = quizState.opts[_i].label || quizState.opts[_i].text || '';
  say((_right ? 'Correct.' : 'Not quite. The answer is ' + _corr + '.')
      + ' Score ' + quizScore + ' of ' + quizTotal + '.');
  // Conceptual questions have no meaningful key - don't paint a random highlight.
  if (!quizState.noWheel) { selected = { slice:quizState.targetSlice, modeIdx:0, fromInner:false }; render(); }
}
window.answerQuiz = answerQuiz;

function handleQuizClick(slice) {
  if (!quizState||quizState.answered||quizState.noWheel) return;
  for (var i=0;i<quizState.opts.length;i++) {
    if (quizState.opts[i].slice===slice) { answerQuiz(i); return; }
  }
}

// The key the user was working on before dipping into the quiz - startQuiz() clears
// the selection to use the wheel as an answer surface, so we stash it and put it
// back on exit instead of dumping the user back to an empty app.
var _preQuizSelected = null;
function toggleQuiz() {
  // The quiz replaces the whole panel, and the metronome button lives in that panel -
  // so a click track started in Assist survived into the quiz with no control left to
  // stop it. setAppMode, setAssistStyle, setAssistEmotion and toggleSound all stop it;
  // this was the one entry point that didn't.
  _stopMetronome();
  quizMode = !quizMode;

  if (quizMode) {
    _preQuizSelected = selected;
    quizScore=0; quizTotal=0; startQuiz();
  } else {
    quizState=null;
    selected = _preQuizSelected; _preQuizSelected = null;
    if (selected) lastModeIdx = selected.modeIdx;
    buildModeStrip(); render(); updatePanel();
  }
}
window.toggleQuiz = toggleQuiz;

// ── Init ──────────────────────────────────────────────────────────────────────
buildModeStrip();

// ── Audio ─────────────────────────────────────────────────────────────────────
var _audioCtx = null;
var _soundOn  = loadPref('sound', true); // was hardcoded true - reset itself every load unlike every other setting

// One definition each - the load-time pref sync (further down) reuses these rather
// than carrying its own copy of the markup.
var _ICON_SOUND_ON  = '<svg width="14" height="14" viewBox="0 0 14 14" style="vertical-align:middle"><polygon points="1,4.5 4,4.5 7,2 7,12 4,9.5 1,9.5" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linejoin="round"/><path d="M8.5 5a2.5 2.5 0 0 1 0 4" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linecap="round"/></svg>';
var _ICON_SOUND_OFF = '<svg width="14" height="14" viewBox="0 0 14 14" style="vertical-align:middle"><polygon points="1,4.5 4,4.5 7,2 7,12 4,9.5 1,9.5" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linejoin="round"/><line x1="9.5" y1="5" x2="12" y2="9" stroke="currentColor" stroke-width="1.3" stroke-linecap="round"/><line x1="12" y1="5" x2="9.5" y2="9" stroke="currentColor" stroke-width="1.3" stroke-linecap="round"/></svg>';

function toggleSound() {
  _soundOn = !_soundOn;
  savePref('sound', _soundOn);
  // Muting must silence a RUNNING metronome too - it's the one audio path that
  // keeps producing sound on its own after the tap that started it.
  if (!_soundOn) _stopMetronome();
  document.getElementById('btn-sound').innerHTML = _soundOn ? _ICON_SOUND_ON : _ICON_SOUND_OFF;
}

function _getCtx() {
  if (!_audioCtx) _audioCtx = new (window.AudioContext || window.webkitAudioContext)();
  return _audioCtx;
}

function _withCtx(fn) {
  var ctx = _getCtx();
  if (ctx.state === 'suspended') {
    ctx.resume().then(fn);
  } else {
    fn();
  }
}

// Semitone → frequency (C4=261.63)
var _FREQ = [261.63,277.18,293.66,311.13,329.63,349.23,369.99,392.00,415.30,440.00,466.16,493.88];

function _playNote(semi, when, dur, baseOct) {
  // semi can be > 11 (e.g. 14 = D above middle C region)
  // baseOct is the octave for semitone 0 (C)
  var b   = baseOct !== undefined ? baseOct : 4;
  var oct = b + Math.floor(semi / 12);
  var note = ((semi % 12) + 12) % 12;
  var ctx  = _getCtx();
  var osc  = ctx.createOscillator();
  var gain = ctx.createGain();
  osc.type = 'triangle';
  osc.frequency.value = _FREQ[note] * Math.pow(2, oct - 4);
  gain.gain.setValueAtTime(0, when);
  gain.gain.linearRampToValueAtTime(0.18, when + 0.015);
  gain.gain.exponentialRampToValueAtTime(0.001, when + dur);
  osc.connect(gain); gain.connect(ctx.destination);
  osc.start(when); osc.stop(when + dur + 0.05);
}

function _playArp(semis, oct) {
  var gap = 0.11;
  // The pulse used to die with the sound: this function returned early when muted, and
  // pulseSemitone was only ever called from inside it. So muting didn't just silence the
  // app - it stopped the wheel lighting up at all, and the people most likely to mute (a
  // DJ beside a mixer, an editor in a shared office) are exactly the ones who lost it.
  // The sound is optional. The feedback that your tap did something is not.
  if (!_soundOn) {
    semis.forEach(function(s,i){ pulseSemitone(s, i*gap*1000); });
    return;
  }
  _withCtx(function() {
    var ctx = _getCtx();
    var now = ctx.currentTime + 0.05;
    var dur = 1.3;
    // Read the clock and the latency ONCE, outside the loop. Reading ctx.currentTime
    // per note meant it advanced by a render quantum between iterations, so each note's
    // lead drifted a few ms differently - the audio spacing was exact and the visual
    // spacing was not, which is the one thing this pairing cannot afford.
    var _t0  = ctx.currentTime;
    var _lat = (ctx.outputLatency || ctx.baseLatency || 0) * 1000;
    // Play ascending, no repeated note
    semis.forEach(function(s,i){
      _playNote(s, now+i*gap, dur, oct||4);
      // Light the sector this note belongs to AT THE MOMENT IT SOUNDS. The audio is
      // scheduled ahead on the WebAudio clock, so the visual is scheduled against
      // the same instant rather than fired now - eye and ear land on one frame,
      // which is what makes it read as one event instead of two.
      // + outputLatency: `now` is when the sample is SUBMITTED, not when it reaches the
      // speaker. Without this the flash consistently leads the note, by 16ms wired and
      // by 100-200ms over Bluetooth - i.e. by an amount that changes with the headphones.
      pulseSemitone(s, (now + i*gap - _t0) * 1000 + _lat);
    });
  });
}

// ── Metronome (design-review consensus: yes, but tied to the recipe hint's BPM,
// not living in the wheel's centre - "the recipe made audible", not a bolted-on
// tool). Simple lookahead scheduler on the existing WebAudio context - no mic,
// no permissions.
// _metroOn is the SYNCHRONOUS state; _metroTimer is the handle, which only appears
// after _withCtx resolves (the AudioContext usually needs an async resume() on its
// first use). Keeping them separate is what stops a fast double-tap from starting
// two schedulers and orphaning the first (an un-killable click track).
var _metroTimer = null, _metroBeat = 0, _metroOn = false;
function _playClick(when, accent) {
  var ctx = _getCtx();
  var osc = ctx.createOscillator(), gain = ctx.createGain();
  osc.type = 'sine';
  osc.frequency.value = accent ? 1600 : 1000;
  gain.gain.setValueAtTime(0.20, when);
  gain.gain.exponentialRampToValueAtTime(0.001, when + 0.05);
  osc.connect(gain); gain.connect(ctx.destination);
  osc.start(when); osc.stop(when + 0.06);
}
function toggleMetronome(bpm, btn) {
  if (_metroOn) {                      // flips synchronously - see _metroOn above
    _stopMetronome();
    if (btn) btn.classList.remove('active');
    return;
  }
  // Every other audio path has a visual half that still works when muted, so honouring
  // the mute there costs nothing. This button has none: a metronome IS the sound. Bailing
  // out left a control that changed no state, showed no message, and kept a tooltip
  // promising "tap to hear this mood's tempo" - a dead control that looked alive.
  // Pressing it is an unambiguous request to hear something, so grant it and let the
  // speaker icon show what changed.
  if (!_soundOn) toggleSound();
  _metroOn = true;
  if (btn) btn.classList.add('active');
  _withCtx(function() {
    if (!_metroOn || _metroTimer) return;  // stopped (or already started) while the context resumed
    var ctx = _getCtx();
    var interval = 60 / bpm;
    var nextTime = ctx.currentTime + 0.05;
    _metroBeat = 0;
    _metroTimer = setInterval(function() {
      while (nextTime < ctx.currentTime + 0.1) {
        _playClick(nextTime, _metroBeat % 4 === 0);
        nextTime += interval; _metroBeat++;
      }
    }, 25);
  });
}
window.toggleMetronome = toggleMetronome;

function _triad(root, type) {
  // root is 0-11 (semitone within octave)
  // return intervals relative to C (so _playNote with baseOct=4 gives correct pitches)
  if (type==='maj') return [root, root+4, root+7];
  if (type==='min') return [root, root+3, root+7];
  if (type==='dim') return [root, root+3, root+6];
  // A secondary dominant is only itself with the seventh: the tritone between the 3rd
  // and the b7 is what makes it PULL to its target. A bare major triad would be the
  // wrong sound for a chip labelled "A7".
  if (type==='dom7') return [root, root+4, root+7, root+10];
  return [root, root+4, root+7];
}

// Called on any tonic selection
function playTonic(slice, modeIdx, fromInner) {
  // No mute gate here: _playArp owns that decision now, because it is the one place
  // that knows the visual pulse has to happen either way.
  var mode = MODES[modeIdx];
  var as   = fromInner ? MROOT.indexOf((MROOT[slice]+mode.off)%12) : slice;
  var root = MROOT[as];
  _playArp(_triad(root, mode.ct[0]), 4);
}

// Called when clicking a diatonic chord pill
function playChordPill(semi, type) {
  _playArp(_triad(semi, type), 4);   // mute handled in _playArp, see playTonic
}

// Play mode scale ascending - highlights characteristic note of each mode
function playModeScale(slice, modeIdx, fromInner) {
  if (!_soundOn) return;
  var mode = MODES[modeIdx];
  var as   = fromInner ? MROOT.indexOf((MROOT[slice]+mode.off)%12) : slice;
  var root = MROOT[as]; // 0-11
  _withCtx(function() {
    var ctx = _getCtx();
    var now = ctx.currentTime + 0.05;
    var gap = 0.20;
    var dur = 0.9;
    // root + mode.iv gives ascending semitones from root
    // e.g. G(7) Ionian: [7,9,11,12,14,16,18]
    // _playNote with baseOct=4: floor(7/12)=0→G4, floor(12/12)=1→C5 ✓
    mode.iv.forEach(function(interval, i) {
      _playNote(root + interval, now + i*gap, dur, 4);
    });
    // Root note one octave up (12 semitones = oct+1)
    _playNote(root + 12, now + mode.iv.length*gap, dur*1.3, 4);
  });
}

// Called when clicking a scale note
function playNotePill(semi) {
  if (!_soundOn) return;
  _withCtx(function() {
    var ctx = _getCtx();
    // semi is 0-11, play in octave 4 always
    _playNote(semi, ctx.currentTime+0.05, 1.2, 4);
  });
}



// ── App Mode (Tonal / Modal) ──────────────────────────────────────────────────
function setAppMode(mode) {
  // The quiz is a takeover: it replaces the panel and turns every wheel tap into an
  // answer. The tab buttons stayed live-looking through all of it - they flipped their
  // active class and aria-selected while updatePanel() short-circuited back to the quiz,
  // so the app claimed you were in Tonal while showing you a quiz. Pressing a tab is an
  // unambiguous "take me elsewhere", so honour it: leave the quiz, then switch.
  if (quizMode) toggleQuiz();
  // The Assist trail is the chain you built in THIS visit to the tab. Leaving ends it,
  // so coming back later never offers a "back" to a key you last saw ten minutes and
  // two tabs ago - which would be a worse lie than having no Back at all.
  if (appMode === 'assist' && mode !== 'assist') _assistTrail.length = 0;
  _stopMetronome(); // leaving Assist (or switching within it) shouldn't leave a click track running
  appMode = mode;
  savePref('appMode', mode); // reopen on the tab you left (the loader reads this)
  // Update switcher buttons (class for looks, aria-selected for assistive tech)
  ['tonal','modal','assist'].forEach(function(m){
    var b = document.getElementById('ms-'+m); if (!b) return;
    b.classList.toggle('active', mode === m);
    b.setAttribute('aria-selected', mode === m ? 'true' : 'false');
  });
  // The mode strip's container is always present (reserves height in every tab so
  // the circle never shifts); buildModeStrip only fills it in Modal. The minor-ring
  // toggle is rendered into the Tonal panel header by updatePanel().
  // KEEP the key's identity across tabs. Tonal and Assist both support the inner
  // (minor) ring, so fromInner is preserved. Only Modal has no inner ring: there we
  // REMAP the selection to its actual tonic sector (same key, outer ring) instead of
  // clearing fromInner - clearing it silently turned Am into "C Aeolian" (a
  // different key!) on every tab switch.
  if (selected && selected.fromInner && mode === 'modal') {
    var _m = MODES[selected.modeIdx];
    var _tonicSemi = (MROOT[selected.slice] + _m.off) % 12;
    var _tonicSlice = MROOT.indexOf(_tonicSemi);
    selected.slice = _tonicSlice;
    selected.tonicSlice = _tonicSlice;
    selected.fromInner = false;   // same tonic, now addressed on the outer ring
  }
  lastModeIdx = mode === 'modal' ? lastModeIdx : (MODES[lastModeIdx].type === 'maj' ? lastModeIdx : 0);
  buildModeStrip();
  render();
  updatePanel();
  // Mode strip appears/disappears below the canvas - refit the circle to height.
  if (typeof resize === 'function') resize();
}

        +'<span class="mood-pad-axis" style="right:6px;top:50%;transform:translateY(-50%)">Bright</span>';
      for(var i=0;i<pts.length;i++){ var pt=pts[i];
        h+='<button class="etile-dot'+(assistEmotion===pt.i?' active':'')+'" style="--eh:'+pt.e.hue+';left:'+pt.x+'%;bottom:'+pt.y+'%" '
          // aria-hidden + tabindex -1: the pad is a spatial VIEW of the list right above
          // it, not a second set of choices. Both rendered the same 19 emotions, so a
          // keyboard user tabbed through Action…Epic twice - 38 stops for 19 options -
          // and the dots' only name was a title attribute, which doesn't exist on touch.
          // The list is already keyboard-complete and carries the names, so the pad is
          // now pointer-only and silent, which is what a picture of the choices should be.
          +'onclick="setAssistEmotion('+pt.i+')" title="'+pt.e.name+'"'
          +' aria-hidden="true" tabindex="-1"><span class="dot" style="background:hsl(var(--eh) 60% 50%)"></span></button>';
      }
      h+='</div>';
    }
  }
  if(assistStyle==='moods' && assistEmotion!==null){
    var re=EMOTIONS[assistEmotion];
    var re_bpm = Math.round((re.bpmLo+re.bpmHi)/2);
    h+='<div class="recipe-hint">'
      +'<span>'+MODES[re.mode].name+'</span><span class="rh-dot">·</span>'
      // Reflect the LIVE metronome state - the panel is rebuilt by many actions
      // (picking a card, changing theme/notation/palette, transposing) and the button
      // used to come back un-lit while the click track was still running, so it read
      // as off and tapping it seemed to do nothing (it was actually stopping it).
      +'<button class="metro-btn'+(_metroOn?' active':'')+'" onclick="toggleMetronome('+re_bpm+',this)" title="Tap to hear this mood\'s tempo">▸ '+re.bpmLo+'-'+re.bpmHi+' BPM</button><span class="rh-dot">·</span>'
      +'<span>'+re.traj+'</span></div>';
  }
  // Relations highlights the wheel + shows a memo instead of suggestion cards.
  if(cs!==null && assistStyle!=='relations'){
    var sg = assistStyle==='dj'
      ? (assistMove===null ? null : djSuggest(cs,cm,assistMove))
      : assistSuggest(cs,cm,assistEmotion);
    if(sg===null){
      h+='<div class="empty" style="margin-top:11px">Pick a move above to see where to go next.</div>';
    }else{
      var lbl = assistStyle==='dj' ? 'Where to go' : 'Next key';
      // Moods: show 6 (the closely-related palette real music mostly uses), the rest
      // - bolder/distant keys - hide behind "More". DJ shows all its move targets.
      var defN = window.innerWidth <= 620 ? 3 : 6;   // fewer on a phone so it fits with no scroll
      var cap = (assistStyle==='dj') ? sg.length : (assistShowMore ? sg.length : Math.min(defN, sg.length));
      h+='<div class="slabel" style="margin-top:11px">'+lbl+'</div>'
        // On-screen legend for the two card axes - previously explained only via a
        // hover title, invisible on the touch-first primary platform.
        +'<div class="axis-legend">brighter/darker = tone shift &nbsp;·&nbsp; Seamless→Cut = how big the jump</div>'
        +'<div class="sugg-list">';
      for(var j=0;j<cap;j++){ var s=sg[j];
        // A rail in the target key's own colour ties the card to its sector on the
        // wheel - the panel was entirely grey next to a saturated colour object.
        h+='<button class="sugg-card'+(showCamHere?'':' no-cam')+'" aria-description="'+s.tip+'" style="border-left:3px solid '+SYNTH[s.slice]+'" onclick="assistPick('+s.slice+','+(s.min?1:0)+','+s.modeIdx+')">'
          +'<span class="sugg-key">'+s.name+'</span>'
          +(showCamHere?'<span class="sugg-cam">'+s.cam+'</span>':'')
          +'<span class="sugg-bright">'+s.bright+'</span>'
          +'<span class="sugg-hard">'+s.hard+'</span></button>';
      }
      h+='</div>';
      if(assistStyle!=='dj' && sg.length>defN){
        h+='<button class="more-btn" onclick="toggleAssistMore()">'+(assistShowMore?'Less':'More - bolder keys')+'</button>';
      }
    }
  }
  h+='</div>';
  panel.innerHTML=h;
  // When the picker opens with a mood already chosen, bring its row into view in
  // the scrollable list (menu convention: the current choice is where you land).
  var _al = document.querySelector('#moodList .mood-li.active');
  if (_al && _al.scrollIntoView) _al.scrollIntoView({block:'nearest'});
  // Panel content just changed - on mobile re-fit the circle so the (now-measured)
  // panel fits without scrolling. Safe: resize()->render() never calls back here.
  if(window.innerWidth<=620 && typeof resize==='function') resize();
}
window.setAssistEmotion=setAssistEmotion; window.assistPick=assistPick;
window.setAssistMove=setAssistMove; window.setAssistStyle=setAssistStyle;

// ── Transpose & Share ─────────────────────────────────────────────────────────
function tStepHTML() {
  return '<span class="kt-step"><span class="kt-lbl">Transpose</span>'
    + '<button type="button" onclick="transpose(1)" title="Transpose up a half step">▲</button>'
    + '<button type="button" onclick="transpose(-1)" title="Transpose down a half step">▼</button></span>';
}
function transpose(dir) {
  if (!selected) return;
  // Move by semitone: find slice whose MROOT is current+dir
  var curSemi  = MROOT[selected.slice];
  var newSemi  = (curSemi + dir + 12) % 12;
  var newSlice = MROOT.indexOf(newSemi);
  selected.slice      = newSlice;
  selected.tonicSlice = newSlice;
  lastModeIdx = selected.modeIdx;
  // Up a semitone is seven sectors clockwise; make the dial travel that way rather
  // than take the five-sector shortcut back, which read as "up" moving down.
  _angDirHint = dir > 0 ? 1 : -1;
  buildModeStrip();
  render();
  updatePanel();
  playTonic(selected.slice, selected.modeIdx, selected.fromInner);
}

function shareLink() {
  var url = location.href.split('?')[0];
  var params = [];
  if (selected) {
    params.push('key=' + selected.slice);
    params.push('mode=' + selected.modeIdx);
    if (selected.fromInner) params.push('inner=1');
  }
  // Always state the tab. Omitting it for Tonal meant a Tonal link opened in
  // whatever tab the RECIPIENT last used (the saved appMode pref wins when there's
  // no app= param).
  params.push('app=' + appMode);
  if (appMode === 'assist') {
    params.push('lens=' + assistStyle);
    if (assistStyle === 'moods' && assistEmotion !== null) params.push('emo=' + assistEmotion);
  }
  if (isCamelot()) params.push('cam=1');
  if (isSol()) params.push('sol=1');
  if (document.documentElement.classList.contains('light')) params.push('light=1');
  // The wheel the recipient sees should be the wheel the sender saw: palette and the
  // minor-ring switch change it just as much as notation does.
  if (curPalette !== 'pastel') params.push('pal=' + curPalette);
  if (!document.getElementById('cb-minor').checked) params.push('minor=0');
  if (params.length) url += '?' + params.join('&');
  // On a phone, sharing a key means sending it to someone - so offer the platform's
  // own share sheet (Messages, Mail, AirDrop…) and fall back to the clipboard on
  // desktop or if the user dismisses it. navigator.share needs a user gesture, which
  // the button click provides.
  if (navigator.share && window.innerWidth <= 620) {
    navigator.share({ title: 'Another Circle Of Fifths', url: url })
      .catch(function(){ /* dismissed or unsupported target - fall back quietly */
        if (navigator.clipboard && navigator.clipboard.writeText) {
          navigator.clipboard.writeText(url).then(function(){ _flashShare('✓ Copied!'); })
            .catch(function(){ if (!_copyFallback(url)) _flashShare('✗ Copy failed'); });
        } else if (!_copyFallback(url)) _flashShare('✗ Copy failed');
      });
    return;
  }
  // The Clipboard API can EXIST and still reject (NotAllowedError when the document
  // isn't focused - routine in an iOS PWA, and on any non-secure origin). Without a
  // catch the user got no feedback at all and the execCommand path below could never
  // run, because it was gated on the API being absent rather than on it failing.
  if (navigator.clipboard && navigator.clipboard.writeText) {
    navigator.clipboard.writeText(url)
      .then(function(){ _flashShare('✓ Copied!'); })
      .catch(function(){ if (!_copyFallback(url)) _flashShare('✗ Copy failed'); });
  } else if (!_copyFallback(url)) {
    _flashShare('✗ Copy failed');
  }
}
// Legacy copy path. Returns whether it worked, so the caller can report honestly.
function _copyFallback(url) {
  try {
    var ta = document.createElement('textarea');
    ta.value = url;
    ta.setAttribute('readonly','');
    ta.style.position='fixed'; ta.style.top='-1000px';   // keep it off-screen, no scroll jump
    document.body.appendChild(ta);
    ta.select();
    var ok = document.execCommand('copy');
    document.body.removeChild(ta);
    if (ok) _flashShare('✓ Copied!');
    return ok;
  } catch(e) { return false; }
}

// Pristine icon markup + a single timer, so repeated taps can't capture the flash
// text as the "original" and leave the button permanently reading "✓ Copied!".
var _shareIconHTML = null, _shareTimer = null;
function _flashShare(msg) {
  var btn = document.getElementById('btn-share');
  if (_shareIconHTML === null) _shareIconHTML = btn.innerHTML;
  if (_shareTimer) clearTimeout(_shareTimer);
  btn.innerHTML = msg;
  btn.style.fontSize = '10px';
  _shareTimer = setTimeout(function(){
    btn.innerHTML = _shareIconHTML; btn.style.fontSize = ''; _shareTimer = null;
  }, 1500);
}

// Apply sticky preferences first (defaults); a share-link URL param overrides below.
(function() {
  if (loadPref('light', false)) document.documentElement.classList.add('light');
  var notation = loadPref('notation', 'notes');
  if (notation === 'camelot') document.getElementById('cb-camelot').checked = true;
  else if (notation === 'solfege') document.getElementById('cb-sol').checked = true;
  var minorPref = loadPref('minor', true);
  document.getElementById('cb-minor').checked = minorPref;
  // Sound icon markup is hardcoded to "on" in the HTML; sync it to the loaded pref
  // (was resetting to on every load regardless of the user's last choice).
  if (!_soundOn) document.getElementById('btn-sound').innerHTML = _ICON_SOUND_OFF;
})();

// Read URL params on load
(function() {
  var p = new URLSearchParams(location.search);
  if (p.get('light') === '1') document.documentElement.classList.add('light');
  if (p.get('cam') === '1') { var _c=document.getElementById('cb-camelot'); if(_c){ _c.checked = true; var _s2=document.getElementById('cb-sol'); if(_s2)_s2.checked=false; } }
  if (p.get('sol') === '1') { var _s=document.getElementById('cb-sol'); if(_s){ _s.checked = true; var _c2=document.getElementById('cb-camelot'); if(_c2)_c2.checked=false; } }
  // hasOwnProperty, not truthiness: PALETTES['constructor'] and PALETTES['__proto__']
  // are truthy via the prototype chain, so ?pal=constructor passed this test, set SYNTH
  // to a function, and made SYNTH[i] undefined - lightenHex then threw inside render()
  // and took the whole load down. Blank wheel, panel stuck on its placeholder, and every
  // later tap throwing too. A pasted link was enough to brick the app unrecoverably.
  if (p.has('pal') && Object.prototype.hasOwnProperty.call(PALETTES, p.get('pal'))) {
    curPalette = p.get('pal'); SYNTH = PALETTES[curPalette];
  }
  if (p.get('minor') === '0') document.getElementById('cb-minor').checked = false;
  // The app should never open doing nothing ("Shazam-simple": always populated,
  // never an empty wheel + "tap a key" as the first thing a new visitor sees).
  // Silent - no auto-playing audio on load. A malformed ?key= falls back here too,
  // rather than leaving the app blank.
  selected = { slice: 0, tonicSlice: 0, modeIdx: 0, fromInner: false };
  if (p.has('key')) {
    var slice = parseInt(p.get('key'));
    var mode  = parseInt(p.get('mode') || '0');
    // inner=1 only means anything on a minor-type mode: the inner ring IS the relative
    // minor. A hand-edited ?key=0&mode=0&inner=1 gave three different answers to "what
    // key am I in" at once - panel said "C major (Ionian)", assistKeyState resolved Am,
    // and the screen reader announced "Am Ionian". The app never emits such a link, but
    // it must not honour one either.
    var inner = p.get('inner') === '1' && MODES[mode] && MODES[mode].type !== 'maj';
    if (slice >= 0 && slice < 12 && mode >= 0 && mode < 7) {
      selected    = { slice: slice, tonicSlice: slice, modeIdx: mode, fromInner: inner };
      lastModeIdx = mode;
    }
  }
  // A share link's `app=` always wins; otherwise resume the tab the user was last
  // on (was resetting to Tonal on every reopen, unlike every other preference).
  var appParam = p.get('app');
  if (appParam === 'tonal') setAppMode('tonal');
  else if (appParam === 'modal') setAppMode('modal');
  else if (appParam === 'assist') {
    var lens = p.get('lens');
    if (lens === 'moods' || lens === 'relations' || lens === 'dj') assistStyle = lens;
    if (p.has('emo')) {
      var emoIdx = parseInt(p.get('emo'));
      if (emoIdx >= 0 && emoIdx < EMOTIONS.length) assistEmotion = emoIdx;
    }
    setAppMode('assist');
  } else {
    var savedMode = loadPref('appMode', 'tonal');
    if (savedMode === 'modal' || savedMode === 'assist') setAppMode(savedMode);
  }
  updateNotationSeg();
  updatePaletteSeg();
  updateAccSeg();      // restore the saved density on load, like every other pref
})();

window.addEventListener('resize', resize);   // resize() repaints the wordmark too
window.addEventListener('orientationchange', resize);
// visualViewport reflects the real height when the mobile toolbar shows/hides.
if (window.visualViewport) window.visualViewport.addEventListener('resize', resize);
function initResize() {
  var w = cv.parentElement ? cv.parentElement.clientWidth : 0;
  if (w > 0) { resize(); if(selected){ buildModeStrip(); updatePanel(); } }
  else { setTimeout(initResize, 50); }
}
if (document.readyState === 'loading') {
  document.addEventListener('DOMContentLoaded', function() { setTimeout(initResize, 0); });
} else { setTimeout(initResize, 0); }

// ── Service worker (PWA) + auto-update ──────────────────────────────────────────
// Makes home-screen installs update themselves: when a new SW takes control we
// reload once, and we poll for a new version whenever the app regains focus.
if ('serviceWorker' in navigator) {
  window.addEventListener('load', function() {
    var hadController = !!navigator.serviceWorker.controller;
    var refreshed = false;
    navigator.serviceWorker.addEventListener('controllerchange', function() {
      // Skip the very first install (no prior controller) to avoid a needless reload.
      if (refreshed || !hadController) return;
      refreshed = true;
      window.location.reload();
    });
    navigator.serviceWorker.register('sw.js').then(function(reg) {
      function checkForUpdate() { reg.update().catch(function(){}); }
      document.addEventListener('visibilitychange', function() {
        if (!document.hidden) checkForUpdate();
      });
      window.addEventListener('focus', checkForUpdate);
    }).catch(function(){});
  });
}
</script>
</body>
</html>
