<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Keymood icon</title>
<style>
  body { margin: 0; padding: 24px 16px; background: #6b6b6b; color: #e8e6e0; font: 14px/1.4 -apple-system, system-ui, sans-serif; }
  h1 { font-size: 16px; font-weight: 600; margin: 0 0 4px; }
  p { color: #9a9890; margin: 0 0 20px; }
  .row { display: flex; flex-wrap: wrap; gap: 28px; }
  figure { margin: 0; display: flex; flex-direction: column; align-items: center; gap: 10px; }
  .ios { width: 180px; height: 180px; border-radius: 40px; overflow: hidden; box-shadow: 0 2px 10px rgba(0,0,0,.5); }
  .small { display: flex; gap: 14px; align-items: flex-end; }
  .small img { border-radius: 22.5%; }
  .ios img { width: 100%; height: 100%; display: block; }
  figcaption { font-weight: 600; }
  .old { opacity: .9; }
</style></head><body>
<h1>Keymood icon - the colours the app draws</h1>
<p>Each at home-screen size and as it shows small. Home screen size, then 60, 40 and 29 px.</p>
<div class="row">
  <figure><div class="ios"><img src="icon-p28w.svg" alt=""></div>
    <div class="small"><img src="icon-p28w.svg" width="60" height="60" alt=""><img src="icon-p28w.svg" width="40" height="40" alt=""><img src="icon-p28w.svg" width="29" height="29" alt=""></div>
    <figcaption>white, before (muddy)</figcaption></figure>
  <figure><div class="ios"><img src="icon-q28w.svg" alt=""></div>
    <div class="small"><img src="icon-q28w.svg" width="60" height="60" alt=""><img src="icon-q28w.svg" width="40" height="40" alt=""><img src="icon-q28w.svg" width="29" height="29" alt=""></div>
    <figcaption>white, app colours</figcaption></figure>
  <figure><div class="ios"><img src="icon-q28d.svg" alt=""></div>
    <div class="small"><img src="icon-q28d.svg" width="60" height="60" alt=""><img src="icon-q28d.svg" width="40" height="40" alt=""><img src="icon-q28d.svg" width="29" height="29" alt=""></div>
    <figcaption>dark, app colours</figcaption></figure>
</div>
</body></html>
